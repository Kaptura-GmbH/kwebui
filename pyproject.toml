[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwebui"
version = "0.10.4"
description = "Build web UIs in pure Python. A clean, plugin-oriented alternative to Streamlit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmad Karambakhsh" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/Kaptura-GmbH/kwebui"
Repository = "https://github.com/Kaptura-GmbH/kwebui"
Issues = "https://github.com/Kaptura-GmbH/kwebui/issues"
Documentation = "https://github.com/Kaptura-GmbH/kwebui/blob/master/docs/user-guide.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
imagestream = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]
file_uploader = [
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["kwebui*"]

[tool.setuptools.package-data]
kwebui = [
    "frontend/templates/*.html",
    "frontend/static/**/*",
    "themes/*.css",
]
